name: Deploy to EC2

on:
  push:
    branches:
      - feature/working-backend-frontend-setup

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy app on EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd ~/app

            git fetch origin
            git reset --hard origin/feature/working-backend-frontend-setup

            # Backend
            cd backend
            npm ci
            pm2 restart backend || pm2 start npm --name backend -- run dev
            pm2 save

            # Frontend
            cd ../frontend

            npm ci

            export NODE_OPTIONS=--max-old-space-size=512

            rm -rf dist

            npm run build

            sudo rm -rf /usr/share/nginx/html/*

            sudo cp -r ~/app/frontend/dist/frontend/browser/* /usr/share/nginx/html/

            sudo systemctl restart nginx